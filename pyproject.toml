[project]
name = "ads-copy-agent"
version = "0.1.0"
description = "Drafts Arabic, English and French ad copy, checks it against brand and ad-policy rules, and analyses a campaign file. A human approves; nothing is posted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sara Hebbadj" }]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "langgraph>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["gradio>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP033 asks for functools.cache; lru_cache is kept because it is more widely known.
ignore = ["UP033"]
